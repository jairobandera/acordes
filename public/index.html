<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acordes · Cancionero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ================= LOGIN / REGISTRO ================= -->
  <div id="authView" class="auth-view hidden">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="logo-dot"></span>
        <h1>Acordes</h1>
      </div>
      <p class="auth-sub">Tu cancionero con acordes, transporte y metrónomo.</p>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Ingresar</button>
        <button class="auth-tab" data-tab="register">Crear cuenta</button>
      </div>

      <!-- Login -->
      <form id="loginForm" class="auth-form">
        <label>Usuario o email
          <input type="text" name="usernameOrEmail" autocomplete="username" required>
        </label>
        <label>Contraseña
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
      </form>

      <!-- Registro -->
      <form id="registerForm" class="auth-form hidden">
        <label>Usuario
          <input type="text" name="username" autocomplete="username" required>
        </label>
        <label>Email
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>Contraseña (mín. 6)
          <input type="password" name="password" autocomplete="new-password" required minlength="6">
        </label>
        <button type="submit" class="btn btn-primary btn-block">Crear cuenta</button>
      </form>

      <p id="authError" class="auth-error"></p>
    </div>
  </div>

  <!-- ================= APP ================= -->
  <div id="appView" class="app-view hidden">
    <!-- Barra superior (mobile) -->
    <header class="topbar">
      <button id="menuToggle" class="icon-btn" aria-label="Menú">☰</button>
      <div class="topbar-brand"><span class="logo-dot"></span> Acordes</div>
      <div id="topbarUser" class="topbar-user"></div>
    </header>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <span class="logo-dot"></span>
        <span>Acordes</span>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="search">🔎 Buscar</button>
        <button class="nav-item" data-view="library">🎵 Mis canciones</button>
        <button class="nav-item" data-view="playlists">📂 Mis listas</button>
        <button class="nav-item hidden" data-view="admin" id="navAdmin">🛠️ Administración</button>
      </nav>

      <div class="sidebar-foot">
        <div class="user-chip">
          <span id="userName" class="user-name"></span>
          <button id="logoutBtn" class="btn-link">Salir</button>
        </div>
      </div>
    </aside>
    <div id="backdrop" class="backdrop hidden"></div>

    <!-- Contenido principal -->
    <main class="main">

      <!-- Vista: Buscar -->
      <section id="view-search" class="view">
        <h2 class="view-title">Buscar canción</h2>
        <form id="searchForm" class="search-bar">
          <select id="sourceSelect" class="select" title="Fuente">
            <option value="lacuerda" selected>lacuerda.net</option>
            <option value="cifraclub">cifraclub.com</option>
          </select>
          <input type="text" id="searchInput" placeholder="Ej: soda stereo de música ligera" autocomplete="off">
          <button type="submit" class="btn btn-primary">Buscar</button>
        </form>
        <p class="hint">Busca por artista y/o canción. Elegí la fuente en el desplegable.</p>
        <div id="searchStatus" class="status"></div>
        <div id="searchResults" class="result-list"></div>
      </section>

      <!-- Vista: Mis canciones -->
      <section id="view-library" class="view hidden">
        <h2 class="view-title">Mis canciones</h2>
        <div id="libraryStatus" class="status"></div>
        <div id="libraryList" class="card-grid"></div>
      </section>

      <!-- Vista: Listas -->
      <section id="view-playlists" class="view hidden">
        <div class="view-head">
          <h2 class="view-title">Mis listas</h2>
          <button id="newPlaylistBtn" class="btn btn-secondary">+ Nueva lista</button>
        </div>
        <div id="playlistsStatus" class="status"></div>
        <div id="playlistsList" class="card-grid"></div>
        <div id="playlistDetail" class="playlist-detail hidden"></div>
      </section>

      <!-- Vista: Administración -->
      <section id="view-admin" class="view hidden">
        <div class="view-head">
          <h2 class="view-title">Administración</h2>
          <button id="newUserBtn" class="btn btn-secondary">+ Crear usuario</button>
        </div>

        <h3 class="subhead">Usuarios</h3>
        <div id="adminStatus" class="status"></div>
        <div id="adminUsers" class="admin-users"></div>

        <!-- Detalle de un usuario -->
        <div id="adminUserDetail" class="playlist-detail hidden"></div>
      </section>

      <!-- Vista: Canción (visor) -->
      <section id="view-song" class="view hidden">
        <button id="backBtn" class="btn-link back-btn">‹ Volver</button>
        <div class="song-header">
          <div>
            <h2 id="songTitle" class="song-title"></h2>
            <p id="songArtist" class="song-artist"></p>
          </div>
          <div id="songActions" class="song-actions"></div>
        </div>

        <!-- Panel de controles -->
        <div class="control-panel">
          <!-- Instrumento -->
          <div class="control-group">
            <span class="control-label">Instrumento</span>
            <select id="instrumentSelect" class="select">
              <option value="guitar" selected>Guitarra</option>
            </select>
          </div>

          <!-- Transporte -->
          <div class="control-group">
            <span class="control-label">Tonalidad</span>
            <div class="transpose-ctl">
              <button id="transDown" class="btn-round" title="Bajar medio tono">−</button>
              <div class="transpose-val">
                <span id="keyDisplay">—</span>
                <small id="transposeAmt">0</small>
              </div>
              <button id="transUp" class="btn-round" title="Subir medio tono">+</button>
            </div>
            <button id="transReset" class="btn-link">reset</button>
          </div>

          <!-- Versión -->
          <div class="control-group" id="versionGroup">
            <span class="control-label">Versión</span>
            <select id="versionSelect" class="select"></select>
          </div>

          <!-- Tamaño de letra -->
          <div class="control-group">
            <span class="control-label">Texto</span>
            <div class="btn-pair">
              <button id="fontDown" class="btn-round">A−</button>
              <button id="fontUp" class="btn-round">A+</button>
            </div>
          </div>
        </div>

        <!-- Metrónomo -->
        <div class="metronome">
          <div class="metro-row">
            <button id="metroToggle" class="btn btn-metro">▶ BPM</button>
            <div class="bpm-ctl">
              <button id="bpmDown" class="btn-round">−</button>
              <input id="bpmInput" type="number" min="20" max="400" value="100">
              <button id="bpmUp" class="btn-round">+</button>
            </div>
            <button id="tapTempo" class="btn btn-secondary" title="Tocá al ritmo">TAP</button>
          </div>
          <div class="metro-row">
            <label class="metro-opt">Compás
              <select id="beatsSelect" class="select select-sm">
                <option value="2">2/4</option>
                <option value="3">3/4</option>
                <option value="4" selected>4/4</option>
                <option value="5">5/4</option>
                <option value="6">6/8</option>
                <option value="7">7/8</option>
              </select>
            </label>
            <label class="metro-opt">Acento
              <select id="accentSelect" class="select select-sm">
                <option value="first" selected>Primer golpe</option>
                <option value="all">Todos</option>
                <option value="none">Sin acento</option>
              </select>
            </label>
          </div>
          <div id="beatDots" class="beat-dots"></div>
        </div>

        <!-- Acordes -->
        <div id="chordSheet" class="chord-sheet"></div>
      </section>

    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- Modal genérico -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button id="modalCancel" class="btn btn-secondary">Cancelar</button>
        <button id="modalOk" class="btn btn-primary">Aceptar</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
