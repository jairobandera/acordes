# Config para desplegar en Render (https://render.com) — plan gratuito.
# Render corre el servidor Node. La base es PostgreSQL en Supabase.
# Completá las variables de entorno en el panel de Render.
services:
  - type: web
    name: acordes
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true          # Render genera una clave segura
      - key: PUBLIC_URL
        sync: false                  # ej: https://acordes.onrender.com
      - key: DATABASE_URL
        sync: false                  # connection string (pooler) de Supabase
      - key: DB_SCHEMA
        value: acordes
      - key: DB_SSL
        value: "true"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
